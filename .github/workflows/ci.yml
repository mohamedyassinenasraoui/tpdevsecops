name: CI/CD - democyber

# Trigger the workflow on push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Gitleaks scan (before compilation)
      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the Gitleaks report
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      # Install Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # Compile Java code
      - name: Compile Java
        run: mvn compile

      # Run unit and integration tests
      - name: Run unit tests
        run: mvn test

      # Run SonarCloud scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Build Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Test Docker image
      - name: Test Docker image locally
        run: |
          cleanup() {
            docker rm -f democyber-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name democyber-test -p 8080:8080 $DOCKER_IMAGE_NAME
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "App failed to become healthy in time"
              docker logs democyber-test || true
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080

      # Trivy scan
      - name: Build Docker image for Trivy
        run: docker build -t democyber:latest .

      - name: Scan Docker image with Trivy (Table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: democyber:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Scan Docker image with Trivy (JSON report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: democyber:latest
          format: 'json'
          output: 'trivy-report.json'

      # Upload the Trivy report
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      # Push Docker image sur Docker Hub
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME
